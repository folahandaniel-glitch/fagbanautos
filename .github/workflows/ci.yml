name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fagdan
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/fagdan?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54329/fagdan?schema=public
      AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnop
      SETTINGS_ENCRYPTION_KEY: ci-only-encryption-key-0123456789
      APPLICATION_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
